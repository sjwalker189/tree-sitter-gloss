name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tree-sitter generate
      # The corpus says the grammar still agrees with what was written down.
      - run: npx tree-sitter test

      # And this says it still agrees with the *language*, which is the check the previous
      # grammar did not have and the reason it drifted into describing a different one.
      - uses: actions/checkout@v4
        with:
          repository: sjwalker189/gloss_rust
          path: gloss-lang
        continue-on-error: true
      - name: check against the compiler's own files
        run: |
          if [ -d gloss-lang/examples ]; then
            script/check-against-compiler gloss-lang
          else
            echo "compiler repo unavailable; skipping"
          fi

      # Indentation is nvim-treesitter's `indentexpr` rather than anything tree-sitter runs,
      # so it needs a real editor and cannot go in `tree-sitter test`. The oracle is the
      # compiler's formatter: `gloss fmt` output re-indented with `gg=G` must be unchanged.
      - uses: rhysd/action-setup-vim@v1
        if: hashFiles('gloss-lang/examples/**') != ''
        with:
          neovim: true
          version: stable
      - uses: actions/checkout@v4
        if: hashFiles('gloss-lang/examples/**') != ''
        with:
          repository: nvim-treesitter/nvim-treesitter
          ref: main
          path: nvim-treesitter
      - name: check indentation against the formatter
        if: hashFiles('gloss-lang/examples/**') != ''
        env:
          GLOSS_TS_RUNTIME: ${{ github.workspace }}/nvim-treesitter
        run: script/check-indents gloss-lang
